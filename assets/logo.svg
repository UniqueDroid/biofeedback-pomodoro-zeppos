<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 248" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
  </defs>

  <!-- In-App-Icon: 248x248, r=120, 4px transparenter Rand -->
